<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--dịch mã dễ hơn tránh bị lỗi font-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--điều chỉnh kích cỡ tùy thoe màn hình-->
    <meta name="theme-color" content="#C4DFF0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Personal website" />
    <!--giúp web dc nhận diện tốt hơn khi SEO => thường hiện ở dưới link-->
    <title>Personal Interest | Bùi Khánh Duy</title>
    <link rel="stylesheet" href="bkd_1.css" /> <!--css chung cho mọi trang-->
    <link rel="stylesheet" href="personal-contact.css" /> <!--css riêng của trang này-->
    <!--link với file css để styling-->
    <link
      rel="icon"
      href="https://i.postimg.cc/1tX0S33w/31ivt8k-BAFL-UXNa-N-FMjpg-QL85-removebg-preview-(1).png"
    />
    <!--dùng để tạo icon ở tab-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header id="header">
      <!--Logo chữ, bấm vào về trang Home-->
      <a class="brand" href="index.html">Darwin<span>.</span>Bui</a>

      <!--MENU MOBILE KHÔNG CẦN JS:
          checkbox ẩn + label. Bấm vào label = tick/bỏ tick checkbox,
          CSS dùng #menu-toggle:checked để mở/đóng menu-->
      <input type="checkbox" id="menu-toggle" class="visually-hidden" />
      <label for="menu-toggle" class="menu-btn" aria-label="Open menu">
        <span></span>
      </label>

      <nav class="table-of-content">
          <a class="content-section" href="index.html">Home</a>
          <a class="content-section" href="about.html">About</a>
          <a class="content-section" href="project.html">Projects</a>
          <a class="content-section" href="academics.html">Academic</a>
          <a class="content-section" href="extracurriculars.html">ECs</a>
          <a class="content-section point" href="personal-interests.html" aria-current="page">Interest</a>
          <a class="content-section" href="contact.html">Contact</a>
      </nav>

      <!--DARK MODE KHÔNG CẦN JS: cùng mẹo checkbox,
          CSS dùng :root:has(#theme-toggle:checked) để đổi màu cả trang-->
      <input type="checkbox" id="theme-toggle" class="visually-hidden" />
      <label for="theme-toggle" class="dark-mode" aria-label="Toggle dark mode">
        <span class="icon-moon">
          <!--icon mặt trăng vẽ bằng SVG (SVG là HTML, không phải JS)-->
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
        </span>
        <span class="icon-sun">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
          </svg>
        </span>
      </label>
    </header>

    <main>
      <section id="personalinterest">
        <h2 class="section-title-2 title_1">MY PERSONAL INTEREST</h2>

        <h3 class="aca-color section-label">Song of the day</h3>
        <div class="song">
          <img
            src="https://i.postimg.cc/8CZMkgrx/1704517365156-300.jpg"
            alt="Toronto 2014 image album"
            class="music-image"
          />
          <audio
            src="https://mp3tourl.com/audio/1781968018858-cb89f77b-95bf-4939-acc3-b79f8967dec1.mp3"
            controls
            loop
            id="audio"
          ></audio>
          <!--controls để nó hiện cái bật nhạc, loop để nó quay lại nếu phát xong-->
        </div>

        <h3 class="aca-color section-label">Video highlight</h3>
        <div class="video">
          <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/KpBFoF7KHIk"
            title="remix music"
            allow="
              accelerometer autoplay clipboard-write encrypted-media gyroscope web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          >
          </iframe>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Darwin Bui. All rights reserved.</p>
    </footer>
  </body>
</html>
